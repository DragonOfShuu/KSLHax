[project]
name = "ksl-filter"
version = "0.1.0"
description = "Scrapes KSL cars for vehicles using a defined scoring system invented by the user"
authors = [
    {name = "Dragon of Shuu",email = "68718280+DragonOfShuu@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "customtkinter (>=5.2.2,<6.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "dacite (>=1.9.2,<2.0.0)",
    "numpy (>=2.3.3,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.16.0"
black = "^25.9.0"
ruff = "^0.14.0"

